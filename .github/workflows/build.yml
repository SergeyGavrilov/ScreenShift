name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Build exe
        run: pip install -r requirements.txt && pyinstaller --onefile --windowed --name ScreenShift screenshift.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenShift
          path: dist/ScreenShift.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ScreenShift.exe
          generate_release_notes: true
